name: Backend tests

on:
  push:
    paths:
      - "FastAPI Backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "FastAPI Backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FastAPI Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "FastAPI Backend/requirements-dev.txt"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check (catches syntax errors fast, before pytest collection)
        run: python -m py_compile $(find app -name "*.py")

      - name: Run pytest
        run: pytest -v
