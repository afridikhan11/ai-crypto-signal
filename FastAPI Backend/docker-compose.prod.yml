# Docker log driver cap (2026-07-27): the default json-file driver has NO
# size limit unless told otherwise - a long-running production container
# logging continuously (this app's scanner logs every symbol analysis
# cycle) would otherwise grow this file on the host disk unbounded. 10MB x
# 5 files = 50MB max per container, rotated automatically by Docker
# itself - same idea as loguru's own in-app file rotation
# (app/core/logging.py's "logs/app_{time}.log", rotation="10 MB",
# retention="7 days"), just applied at the container-log level too so
# `docker logs`/`docker compose logs` output can't silently fill the disk.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crypto_signals
    # No host port mapping - only the app container can reach Postgres,
    # over the internal docker network, by service name ("db"). The dev
    # compose file exposes 5432 to the host for local debugging; a
    # production deployment should not expose the database directly.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it pg_isready uses the
      # unix socket, which the TEMPORARY server the postgres image runs
      # during initdb also answers while accepting no TCP connections at
      # all (it sets listen_addresses=''). A socket-only check reports
      # healthy while the app's connection to db:5432 is still refused.
      #
      # $$ escapes to a single $ so the variable is expanded inside the db
      # container, where POSTGRES_USER/POSTGRES_DB are set.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Same reasoning as db above - internal only in production.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

  app:
    build: .
    # No --reload (that's a dev convenience that re-imports the whole app
    # on every file change - unnecessary overhead and file-watching
    # surface area in production) and explicitly --workers 1: the
    # scanner/SignalMonitor/websocket listener are singleton in-process
    # background tasks with no cross-worker coordination (no distributed
    # lock), so running multiple workers would spin up multiple
    # independent scanners generating duplicate signals against the same
    # symbols. Scale this app vertically (bigger machine), not by adding
    # uvicorn workers, unless that coordination is built first.
    # Server arguments ONLY. Waiting for PostgreSQL and running
    # `alembic upgrade head` happen in the image's ENTRYPOINT
    # (scripts/docker-entrypoint.sh), which a `command:` override cannot
    # bypass. Previously this line carried the migration itself, so any
    # edit to it could silently drop the migration step.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    # No bind-mount of source - production runs the code baked into the
    # image at build time, not a live view of the host filesystem.
    # logs/ IS mounted as a named volume (2026-07-27 addition) so loguru's
    # file-based logs (app/core/logging.py's rotating "logs/app_{time}.log"
    # files - the same ones already used for production debugging, e.g.
    # the Gold Signal investigation) survive container restarts/redeploys
    # instead of being lost with the container's ephemeral filesystem.
    # Real-time `docker logs`/`docker compose logs` output (stdout) already
    # worked before this change and is unaffected by it.
    volumes:
      - app_logs:/app/logs
      # data/ MUST live outside the image (2026-07-31). Two reasons:
      #
      # SECRETS - data/binance_credentials.enc holds the encrypted exchange
      # API keys. .dockerignore now excludes it from the build context, so
      # the image contains no credentials; the operator places the file on
      # the host and it is mounted in. Baking keys into an image puts them
      # in every layer, every registry copy and every `docker save`.
      #
      # CONTROL-PLANE STATE - data/trading_settings.json holds
      # engine_run_state, auto-trading on/off and entry_mode, and is
      # WRITTEN AT RUNTIME. Without this mount those writes went to the
      # container's ephemeral filesystem, so every redeploy silently
      # reverted the trading control plane to whatever was baked into the
      # image - including re-enabling Auto Trading after a deliberate stop.
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      # service_started only waits for the container to exist, not for
      # PostgreSQL inside it to accept connections. That is what produced
      # `ConnectionRefusedError: Connect call failed ('db', 5432)`.
      # `restart: unless-stopped` on db means it can also bounce while the
      # app is already running - Compose does not re-gate on that, which is
      # why scripts/wait_for_db.py exists in the image as well.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  app_logs:
