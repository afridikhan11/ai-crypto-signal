# Alembic configuration.
#
# STATUS (2026-07-30): this is the FIRST real migration setup in this
# project. Schema evolution previously relied on `Base.metadata.create_all()`
# plus hand-written idempotent `ALTER TABLE ... ADD COLUMN IF NOT EXISTS`
# statements in app/main.py's startup hook. Those existing statements are
# left untouched (they are already applied everywhere and are safe to
# re-run); everything from `initial_stop_loss` onward is managed here
# instead.
#
# The database URL is NOT stored in this file - alembic/env.py reads it
# from the same `app.core.config.Settings.database_url` the application
# itself uses, so the two can never point at different databases.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
