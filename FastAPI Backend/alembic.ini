# Alembic configuration.
#
# STATUS (2026-07-31): ALEMBIC IS THE SINGLE OWNER OF THIS SCHEMA.
#
# Until 2026-07-31 it was not. The application built and patched its own
# schema at startup - `Base.metadata.create_all()` plus ~15 hand-written
# `ALTER TABLE ... ADD COLUMN IF NOT EXISTS` statements and several
# `ALTER TYPE` statements in app/main.py's startup hook - and Alembic was
# never invoked anywhere. Because Alembic creates `alembic_version` only
# when a command actually runs, that table never existed and the
# migration history silently diverged from the live database.
#
# That startup code has been moved intact to
# app/core/legacy_schema_bootstrap.py, where it is quarantined behind
# DB_AUTO_BOOTSTRAP (default False) and refuses to execute. Every
# container entrypoint now runs `alembic upgrade head` before uvicorn,
# and revision 20260730_00 defines the pre-Alembic baseline so the chain
# can build a completely empty database.
#
# Application code performs NO DDL. This is enforced by
# tests/test_schema_ownership.py, not by convention.
#
# The database URL is NOT stored in this file - alembic/env.py reads it
# from the same `app.core.config.Settings.database_url` the application
# itself uses, so the two can never point at different databases.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
